name: App Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Speed Tip: If you have a paid GitHub plan, use 'ubuntu-latest-4-core' 
    # for significantly faster compilation.
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
    #      cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Optimization: Prevents the cache from being overwritten on PRs
          # while still allowing the build to use existing cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          
      - name: Make gradlew executable
        run: chmod +x gradlew 
        
            
        # 7. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --parallel --build-cache --stacktrace

      - name: Upload APK
    #    if: github.event_name == 'push' # Only upload on merge to save time on PRs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0 # No compression = faster upload if the APK is small