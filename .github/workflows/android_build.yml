name: Android Builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Apps
    runs-on: ubuntu-latest
    
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -Xmx2g"

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 23 (Required for TargetSdk 36 / Gradle 9.3+)
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'gradle' # Basic Java-level gradle caching

      # 3. Setup Gradle with Advanced Caching Options
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only download cache if it's a hit (saves bandwidth)
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Enables detailed Build Summary in GitHub Actions UI
          add-job-summary: 'on'
          # Advanced Caching settings
          cache-overwrite-existing: false # Speeds up by not overwriting valid caches
          generate-job-summary: true

      # 4. Grant execute permission for the Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Run Lint, Tests, and Build in a Single Step
      - name: Run Analysis, Tests, and Build APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --build-cache --stacktrace --no-daemon
        continue-on-error: true

      # 6. Upload Quality Reports
      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/lint-results-*
            app/build/test-results/testDebugUnitTest

      # 7. Upload Debug APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk