# Version catalog - all libraries upgraded to latest stable (verified 2026-11-01 against
# Maven Central / Google Maven group-index / JitPack). NewPipeExtractor pinned by JitPack tag.
# Caps: Coil 3.5.0 (3.6.x AAR metadata requires the unpublished API 37 platform),
#       Rhino 1.8.1 (1.9.x dexes only with minSdk 26+).
