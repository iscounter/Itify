# AGP 9.5 defaults to built-in Kotlin + new DSL; we keep explicit KGP control
# (Kotlin 2.4.21) via the documented temporary bypass until the AGP 10 migration.
android.builtInKotlin=false
android.newDsl=false
#org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
#org.gradle.workers.max=1
#org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.compiler.execution.strategy=in-process
